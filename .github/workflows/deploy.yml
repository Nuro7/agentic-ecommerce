name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd ~/agentic-ecommerce
            git fetch --all
            git reset --hard origin/main
            sudo docker compose --env-file backend/.env -f infra/docker/docker-compose.prod.yml down --remove-orphans
            sudo docker compose --env-file backend/.env -f infra/docker/docker-compose.prod.yml up -d --build
            sudo docker image prune -f
            curl -sf https://speako.nuro7.in/api/v1/health && echo "Deploy OK" || echo "Health check FAILED"
